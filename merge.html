<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'"
    />
    <meta name="theme-color" content="#241608" />
    <meta name="description" content="Meyve Birleştir — reklamsız, çevrimdışı çalışan meyve birleştirme oyunu." />
    <title>Meyve Birleştir</title>
  </head>
  <body>
    <div class="wrap">
      <div class="hud">
        <div class="score-col">
          <div class="label">SKOR</div>
          <div class="score" id="score">0</div>
          <div class="best">EN İYİ <b id="best">0</b></div>
        </div>
        <div class="biggest" id="biggest-box" hidden>
          <canvas id="biggest-fruit"></canvas>
          <div class="label">EN BÜYÜK</div>
        </div>
        <div class="next">
          <div class="next-slot"><canvas id="next-fruit"></canvas></div>
          <div class="label">SIRADAKİ</div>
        </div>
      </div>

      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div class="combo" id="combo"></div>

        <div class="overlay" id="start-overlay">
          <div class="card">
            <div class="logo">🍒🍇🍉</div>
            <h1>Meyve Birleştir</h1>
            <p class="tag">Aynı meyveler birleşir. Hedef: <b>karpuz</b>.</p>
            <button class="btn" id="start" type="button">Başla</button>
            <button class="btn ghost" id="fresh" type="button" hidden>Yeni Oyun</button>
            <p class="fine">Reklamsız · çevrimdışı · kaydın saklanır</p>
          </div>
        </div>

        <div class="overlay" id="over-overlay">
          <div class="card">
            <h2 id="over-title">Oyun Bitti</h2>
            <div class="final" id="final-score">0</div>
            <p class="tag" id="final-sub"></p>
            <div class="result-fruit"><canvas id="result-fruit"></canvas><span id="result-name"></span></div>
            <button class="btn" id="again" type="button">Tekrar Oyna</button>
          </div>
        </div>
      </div>

      <div class="footer">
        <button id="sound" class="icon-btn" type="button" aria-label="Sesi kapat">🔊</button>
        <span class="tip" id="tip">Sürükle, bırak, birleştir</span>
        <button id="restart" class="icon-btn" type="button" aria-label="Yeniden başlat">↻</button>
      </div>
    </div>
    <script type="module" src="/src/merge-main.ts"></script>
  </body>
</html>
