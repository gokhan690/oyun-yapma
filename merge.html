<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="merge-icon.svg" />
    <link rel="apple-touch-icon" href="merge-icon-192.png" />
    <link rel="manifest" href="merge.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meyve" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'"
    />
    <meta name="theme-color" content="#241608" />
    <meta name="description" content="Meyve Birleştir — reklamsız, çevrimdışı çalışan meyve birleştirme oyunu." />
    <title>Meyve Birleştir</title>
  </head>
  <body>
    <noscript>
      <style>
        .wrap { display: none !important; }
        body { display: block; }
      </style>
      <div class="noscript-card">
        <h2>Oyun JavaScript ile çalışıyor</h2>
        <p>
          Bu sayfa şu an betikler kapalıyken açıldı. iPhone'da <b>Dosyalar</b> uygulaması
          HTML dosyalarını yalnızca <i>önizleme</i> olarak gösterir ve JavaScript çalıştırmaz;
          bu yüzden oyun burada başlamaz.
        </p>
        <p><b>Çözüm:</b> Oyunun adresini Safari veya Chrome'da aç, ardından
          <b>Paylaş → Ana Ekrana Ekle</b> de. Böylece uygulama gibi tam ekran açılır ve
          ilk açılıştan sonra internetsiz de çalışır.</p>
      </div>
    </noscript>

    <div class="wrap">
      <div class="hud">
        <div class="score-col">
          <div class="label">SKOR</div>
          <div class="score" id="score">0</div>
          <div class="best">EN İYİ <b id="best">0</b></div>
        </div>
        <div class="timer" id="timer" hidden>
          <div class="label">SÜRE</div>
          <div class="clock" id="clock">2:00</div>
        </div>
        <div class="biggest" id="biggest-box" hidden>
          <canvas id="biggest-fruit"></canvas>
          <div class="label">EN BÜYÜK</div>
        </div>
        <div class="next">
          <div class="next-slot"><canvas id="next-fruit"></canvas></div>
          <div class="label">SIRADAKİ</div>
        </div>
      </div>

      <div class="missions" id="missions"></div>
      <div class="fever-bar" id="fever-bar"><div class="fever-fill" id="fever-fill"></div></div>

      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div class="combo" id="combo"></div>

        <!-- Açılış / ana menü -->
        <div class="overlay" id="start-overlay">
          <div class="card scroll">
            <div class="logo">🍒🍇🍉</div>
            <h1>Meyve Birleştir</h1>
            <p class="tag">Aynı meyveler birleşir. Hedef: <b>karpuz</b>.</p>

            <div class="chain-label">MOD</div>
            <div class="modes" id="modes"></div>
            <p class="daily-line" id="daily-line" hidden></p>

            <div class="chain-label">SIRALAMA</div>
            <div class="chain" id="chain"></div>

            <div class="chain-label">YARDIMCILAR — <span id="loadout-count">3</span>/3 seçili</div>
            <div class="loadout" id="loadout"></div>

            <button class="btn" id="start" type="button">Başla</button>
            <button class="btn ghost" id="fresh" type="button" hidden>Yeni Oyun</button>

            <div class="menu-links">
              <button class="link-btn" id="open-ach" type="button">🏆 Başarımlar</button>
              <button class="link-btn" id="open-album" type="button">📖 Albüm</button>
            </div>

            <p class="stats" id="stats" hidden></p>
            <p class="fine" id="fine">Reklamsız · çevrimdışı · kaydın saklanır</p>
          </div>
        </div>

        <!-- Oyun sonu raporu -->
        <div class="overlay" id="over-overlay">
          <div class="card scroll">
            <h2 id="over-title">Oyun Bitti</h2>
            <div class="final" id="final-score">0</div>
            <p class="tag" id="final-sub"></p>
            <div class="report" id="report"></div>
            <div class="mission-result" id="mission-result"></div>
            <div class="earned" id="earned"></div>
            <button class="btn" id="again" type="button">Tekrar Oyna</button>
            <button class="btn ghost" id="to-menu" type="button">Menüye Dön</button>
          </div>
        </div>

        <!-- Başarımlar -->
        <div class="overlay" id="ach-overlay">
          <div class="card scroll">
            <h2>🏆 Başarımlar</h2>
            <p class="tag" id="ach-count"></p>
            <div class="trophy-list" id="trophies"></div>
            <button class="btn" id="close-ach" type="button">Kapat</button>
          </div>
        </div>

        <!-- Meyve albümü -->
        <div class="overlay" id="album-overlay">
          <div class="card scroll">
            <h2>📖 Meyve Albümü</h2>
            <p class="tag" id="album-count"></p>
            <div class="album" id="album"></div>
            <button class="btn" id="close-album" type="button">Kapat</button>
          </div>
        </div>
      </div>

      <div class="footer">
        <button id="sound" class="icon-btn" type="button" aria-label="Sesi kapat">🔊</button>
        <div class="powerups" id="powerups"></div>
        <button id="restart" class="icon-btn" type="button" aria-label="Yeniden başlat">↻</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="/src/merge-main.ts"></script>
  </body>
</html>
